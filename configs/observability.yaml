    - banking_router.routing.distribution_shift
    - banking_router.routing.window_observations
  span_names:
    - banking_router.http.request
    - banking_router.model.load
attributes:
  allowed_keys:
    - deployment.device
    - deployment.environment
    - error.type
    - http.request.method
    - http.response.status_code
    - http.route
    - model.uncertainty.bucket
    - model.version
    - policy.version
    - privacy.redaction.category
    - route.action
    - route.processing_status
    - service.version
    - telemetry.outcome
  prohibited_keys:
    - account
    - authorization
    - baggage
    - content
    - correlation_id
    - customer
    - email
    - message
    - message_hash
    - name
    - payload
    - prompt
    - query
    - redacted_text
    - request_id
    - subject
    - text
    - token
    - user
routing_distribution:
  dimension: route.action
  reference_source_path: reports/service/module10-api-evaluation.json
  expected_reference_source_sha256: c2c6e439a632a70c82a09e69213a0ce6459e2853dc09b94ad58eae34a2d33385
  reference_scope: synthetic_module10_local_integration_not_production_baseline
  rolling_window_observations: 100
  minimum_observations: 20
  reference:
    human_review: 0.8333333333333334
    security_queue: 0.16666666666666666
  alerting_threshold_approved: false
registered_deployment_profiles:
  configs/deployment/native-mps.yaml: 9e2f31e36f280130f95400e6044a0909465ddc0a2ebe6ea3505a199688e4f660
  configs/deployment/linux-cpu.yaml: bf98088665ebffcc1e43baac4f947a30b1e1ce02b7cd6ffaeccf5ddda09cc516
  configs/deployment/linux-cuda.yaml: 39729e1da738f0d7f7a348e4de310e1f58b986342488fccebe74ca3740b06402
claims:
