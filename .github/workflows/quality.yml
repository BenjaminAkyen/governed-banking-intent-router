name: quality-and-evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format, type and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: python -m pip install -e ".[dev]"

      - name: Lint maintained Python scope
        run: ruff check src scripts tests

      - name: Check formatting on changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci/check_changed_python.py --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Type-check governed safety boundary
        run: mypy

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify wheel installation without dependency resolution
        run: |
          python -m venv .package-check
          .package-check/bin/python -m pip install --no-deps dist/*.whl
          .package-check/bin/python -c "import importlib.metadata; print(importlib.metadata.version('governed-banking-intent-router'))"

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  cpu-tests:
    name: CPU tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test environment
        run: python -m pip install -e ".[dev]"

      - name: Run complete CPU test suite
        run: |
          mkdir -p artifacts/test-results artifacts/environment
          pytest -q --junitxml="artifacts/test-results/cpu-${RUNNER_OS}-py${{ matrix.python }}.xml"
          python -m pip list --format=json > "artifacts/environment/cpu-${RUNNER_OS}-py${{ matrix.python }}.json"

      - name: Upload CPU test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-${{ runner.os }}-py${{ matrix.python }}-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  safety-evidence:
    name: Safety suites, coverage and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test environment
        run: python -m pip install -e ".[dev]"

      - name: Run privacy, policy, integration and unit suites
        run: |
          mkdir -p artifacts/test-results artifacts/coverage artifacts/benchmarks
          pytest -q -m privacy --cov=governed_banking --cov-report= --junitxml=artifacts/test-results/privacy.xml
          pytest -q -m policy --cov=governed_banking --cov-append --cov-report= --junitxml=artifacts/test-results/policy.xml
          pytest -q -m integration --cov=governed_banking --cov-append --cov-report= --junitxml=artifacts/test-results/integration.xml
          pytest -q -m "not privacy and not policy and not integration" --cov=governed_banking --cov-append --cov-report= --junitxml=artifacts/test-results/unit.xml
          coverage json -o artifacts/coverage/coverage.json
          coverage xml -o artifacts/coverage/coverage.xml

      - name: Enforce safety-critical module floors
        run: >-
          python scripts/ci/check_coverage.py
          --coverage artifacts/coverage/coverage.json
          --contract configs/ci/coverage-gates.yaml
          --output artifacts/coverage/safety-gates.json

      - name: Generate metadata-only control benchmark
        run: >-
          python scripts/ci/run_control_benchmark.py
          --iterations 100
          --output artifacts/benchmarks/control-path.json

      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safety-test-and-benchmark-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  dependency-and-secret-audit:
    name: Dependency, SBOM and secret audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install auditable environment
        run: python -m pip install -e ".[dev]"

      - name: Audit installed dependencies
        run: |
          mkdir -p artifacts/security
          pip-audit --local --skip-editable --progress-spinner=off --format=json --output=artifacts/security/pip-audit.json
          pip-audit --local --skip-editable --progress-spinner=off --format=cyclonedx-json --output=artifacts/security/python-sbom.cdx.json

      - name: Scan tracked files for provider credentials and private keys
        run: python scripts/ci/scan_secrets.py --output artifacts/security/secret-scan-summary.json

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 30

  container-build:
    name: Container build contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHON_CI_IMAGE: python:3.12-slim-bookworm@sha256:77d09d2d4b67b10199ac27ca3bdf23c4ba8e7951e67cc808a174c65507e9e52c
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Validate deployment Dockerfile contracts
        run: |
          docker build --check --build-arg PYTHON_CPU_IMAGE="$PYTHON_CI_IMAGE" --file deploy/docker/cpu.Dockerfile .
          docker build --check --build-arg PYTORCH_CUDA_IMAGE="$PYTHON_CI_IMAGE" --file deploy/docker/cuda.Dockerfile .

      - name: Build lightweight package-verification container
        run: >-
          docker build
          --build-arg PYTHON_CI_IMAGE="$PYTHON_CI_IMAGE"
          --file deploy/docker/ci.Dockerfile
          --tag "governed-router-ci:${GITHUB_SHA}"
          .

      - name: Run container smoke check with restricted privileges
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          "governed-router-ci:${GITHUB_SHA}"
