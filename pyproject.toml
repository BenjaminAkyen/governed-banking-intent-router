[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-banking-intent-router"
version = "0.1.0"
description = "A privacy-aware banking support router with calibrated LoRA-RoBERTa and deterministic escalation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Benjamin Akyen" }]
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=5,<6",
  "fastapi>=0.116,<1",
  "numpy>=2,<3",
  "pandas>=2.3,<4",
  "peft>=0.20,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.7,<2",
  "torch>=2.12,<3",
  "transformers>=5,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
notebook = [
  "ipykernel>=6.30,<8",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
